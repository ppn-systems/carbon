name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build contracts
        run: dotnet build contracts/Carbon.Contracts.slnx -c Release
      - name: Build engine
        run: dotnet build engine/Carbon.Engine.slnx -c Release
      - name: Build graphics
        run: dotnet build graphics/Carbon.Graphics.slnx -c Release
      - name: Build server
        run: dotnet build server/Carbon.Host.slnx -c Release
      - name: Build server configuration
        run: dotnet build server/Carbon.Server.slnx -c Release
      - name: Build desktop
        run: dotnet build desktop/Carbon.Desktop.slnx -c Release
      - name: Test contracts
        run: dotnet test tests/Carbon.Contracts.Tests.slnx -c Release
      - name: Test engine
        run: dotnet test tests/Carbon.Engine.Tests.slnx -c Release
      - name: Test graphics
        run: dotnet test tests/Carbon.Graphics.Tests.slnx -c Release
      - name: Test server
        run: dotnet test tests/Carbon.Host.Tests.slnx -c Release
      - name: Test server configuration
        run: dotnet test tests/Carbon.Server.Tests.slnx -c Release
      - name: Test desktop
        run: dotnet test tests/Carbon.Desktop.Tests.slnx -c Release
      - name: Test architecture
        run: dotnet test tests/Carbon.Architecture.Tests.slnx -c Release
