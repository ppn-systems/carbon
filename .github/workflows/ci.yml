name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build graphics
        run: dotnet build graphics/Carbon.Graphics.slnx -c Release
      - name: Test
        run: dotnet test tests/Carbon.Graphics.Tests.slnx -c Release
