; Servers the client's Server screen offers (ADR-037). One [server.<id>] section per server, in display order:
; name is shown to players, so make it a friendly server name; host and port are where the client connects.
; A client started with CARBON_SERVER_HOST / CARBON_TCP_PORT for an unlisted server also shows it as a custom server.

[server.local]
name = Home Realm
host = 127.0.0.1
port = 57207
