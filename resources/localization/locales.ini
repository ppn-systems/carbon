; Selectable client languages and their font stacks (ADR-023 D1, D5).
; [locale.<code>] needs <code>.ini next to this file.
; fonts = primary-first, comma-separated file@pixelSize under resources/fonts.

[general]
default = en

[locale.en]
name = English
fonts = vt323.ttf@20

[locale.vi]
name = Tiếng Việt
fonts = vt323.ttf@20
