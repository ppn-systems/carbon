[status_effects]
poisoned.name = Poisoned
poisoned.desc = Poison seeps through you. You take damage over time, move slower and cannot regenerate health. Poison never takes your last hit point.
slowed.name = Slowed
slowed.desc = Your legs feel heavy. You move slower until it wears off.
bleeding.name = Bleeding
bleeding.desc = An open wound. You take damage every second, and bleeding can kill you.
stunned.name = Stunned
stunned.desc = A heavy blow knocked the wind out of you. You cannot move or attack.
hungry.name = Hungry
hungry.desc = Your stomach growls. Eat something before you slow down and stop regenerating.
starving.name = Starving
starving.desc = You are starving. You move much slower and take damage until you eat.
tired.name = Tired
tired.desc = You need rest. Sit or sleep in a bed before exhaustion slows you down.
well_fed.name = Well fed
well_fed.desc = A full belly. You regenerate health faster out of combat.
rested.name = Rested
rested.desc = You slept well. Your stamina recovers faster.
drowning.name = Drowning
drowning.desc = You are out of air. You take damage every second and cannot heal until you surface, and drowning can kill you.
weakness.name = Weakness
weakness.desc = A shaman's curse saps your strength. Every hit you land deals less damage until it fades.
blindness.name = Blindness
blindness.desc = Ash fills your eyes. You see much less of the world around you until it clears.
burning.name = Burning
burning.desc = You are on fire. You take damage every second and burning can kill you. Jump into water to put it out.
frostbite.name = Frostbite
frostbite.desc = Biting cold numbs your limbs. You take small damage over time and your stamina recovers slower. Frostbite never takes your last hit point.
